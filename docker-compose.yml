services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a fresh root password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wa_akg}
      MYSQL_USER: wa_akg
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a fresh application DB password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3030}:3000"
    environment:
      DATABASE_URL: mysql://wa_akg:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-wa_akg}
      AUTH_SECRET: ${AUTH_SECRET:?Generate a fresh authentication secret}
      WA_AUTH_ENCRYPTION_KEY: ${WA_AUTH_ENCRYPTION_KEY:?Generate a fresh encryption key}
      BASE_URL: ${BASE_URL:-http://localhost:3030}
      AUTH_URL: ${BASE_URL:-http://localhost:3030}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ENABLE_TELEMETRY: "false"
      ENABLE_GATEWAY_SCHEDULER: "false"
      WEBHOOK_ALLOWED_ORIGINS: ${WEBHOOK_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data

  provision:
    profiles: ["provision"]
    build:
      context: .
      target: builder
    user: node
    environment:
      DATABASE_URL: mysql://wa_akg:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-wa_akg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "node_modules/prisma/build/index.js", "db", "push", "--skip-generate"]

volumes:
  mysql_data:
  app_data:
